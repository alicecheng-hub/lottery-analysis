<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>台灣樂透大數據分析</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{
  --bg:#0a0a12;--bg2:#0f0f1e;--card:#13131f;--card2:#1a1a2e;--border:#2a2a45;
  --gold:#f5c842;--red:#ff4e6a;--blue:#4e9bff;--green:#42e695;
  --text:#e8e8ff;--text2:#8888aa;--accent:#7c5cfc;
  --z1:#e74c3c;--z2:#2ecc71;--z3:#3498db;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding-bottom:50px}
.header{background:linear-gradient(135deg,#1a0a35,#0a1535);padding:18px 16px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--gold),#ff9f43);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-sub{display:flex;justify-content:space-between;align-items:center;margin-top:3px}
.header p{font-size:11px;color:var(--text2)}
.updated{font-size:10px;color:var(--text2)}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:12px 8px;border:none;background:transparent;color:var(--text2);font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;border-bottom:3px solid transparent}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(245,200,66,.06)}
.sec-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.sec-tabs::-webkit-scrollbar{display:none}
.sec-tab{padding:9px 14px;border:none;background:transparent;color:var(--text2);font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s}
.sec-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(124,92,252,.06)}
.controls{padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.control-label{font-size:12px;color:var(--text2);white-space:nowrap}
.period-btns{display:flex;gap:5px}
.period-btn{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:12px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all .2s}
.period-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.main{padding:12px;display:none}
.main.active{display:block}
.sc{background:var(--card);border-radius:14px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.sh{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.si{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.st{font-size:14px;font-weight:700}
.ss{font-size:10px;color:var(--text2);margin-left:auto}
.last-draw{padding:12px 14px;background:rgba(245,200,66,.05);border-bottom:1px solid var(--border)}
.ld-title{font-size:11px;color:var(--text2);margin-bottom:8px}
.draw-balls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.db{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;background:var(--card2);border:2px solid var(--border)}
.db.sp{background:rgba(245,200,66,.2);border-color:var(--gold);color:var(--gold)}
.plus{color:var(--text2);font-size:14px}
.zone-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.zbadge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.stat-cell{background:var(--card);padding:10px;text-align:center}
.stat-val{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace}
.stat-lbl{font-size:10px;color:var(--text2);margin-top:2px}
.num-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:12px}
.nb{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace}
.nb .cnt{font-size:8px;font-weight:400;opacity:.7;margin-top:1px;font-family:'Noto Sans TC',sans-serif}
.h5{background:#c0392b;color:#fff;box-shadow:0 0 10px rgba(192,57,43,.5)}
.h4{background:#e74c3c;color:#fff}
.h3{background:#e67e22;color:#fff}
.h2{background:#f39c12;color:#fff}
.h1{background:#f1c40f;color:#333}
.h0{background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.c5{background:#1a4b8c;color:#fff;box-shadow:0 0 10px rgba(26,75,140,.5)}
.c4{background:#2471a3;color:#fff}
.c3{background:#2980b9;color:#fff}
.c2{background:#5dade2;color:#fff}
.c1{background:#85c1e9;color:#333}
.nb.z1-num{border:2px solid var(--z1)}
.nb.z2-num{border:2px solid var(--z2)}
.nb.z3-num{border:2px solid var(--z3)}
.bar-list{padding:10px 14px}
.bar-row{display:flex;align-items:center;margin-bottom:7px;gap:8px}
.bar-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.bar-track{flex:1;height:18px;background:var(--bg);border-radius:9px;overflow:hidden}
.bar-fill{height:100%;border-radius:9px;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:700;min-width:30px}
.bar-value{font-size:11px;color:var(--text2);width:50px;text-align:right;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.miss-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
.miss-card{background:var(--bg2);border-radius:10px;padding:10px 12px;border:1px solid var(--border);display:flex;align-items:center;gap:10px}
.miss-ball{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.miss-p{font-size:14px;font-weight:700;color:var(--blue)}
.miss-l{font-size:10px;color:var(--text2)}
.legend{display:flex;gap:10px;padding:8px 14px;flex-wrap:wrap;border-top:1px solid var(--border)}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text2)}
.ld{width:14px;height:14px;border-radius:50%}
.zone-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.zone-card{border-radius:10px;padding:10px;text-align:center;border:1px solid}
.zone-card.z1c{background:rgba(231,76,60,.1);border-color:rgba(231,76,60,.3)}
.zone-card.z2c{background:rgba(46,204,113,.1);border-color:rgba(46,204,113,.3)}
.zone-card.z3c{background:rgba(52,152,219,.1);border-color:rgba(52,152,219,.3)}
.zone-name{font-size:11px;font-weight:700;margin-bottom:4px}
.zone-range{font-size:10px;color:var(--text2);margin-bottom:6px}
.zone-avg{font-size:20px;font-weight:900;font-family:'JetBrains Mono',monospace}
.zone-sub{font-size:10px;color:var(--text2);margin-top:2px}
.combo-list{padding:10px 14px}
.combo-row{display:flex;align-items:center;margin-bottom:8px;gap:8px}
.combo-label{display:flex;gap:4px;flex-shrink:0}
.combo-badge{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.combo-track{flex:1;height:20px;background:var(--bg);border-radius:10px;overflow:hidden}
.combo-fill{height:100%;border-radius:10px;display:flex;align-items:center;padding-left:10px;font-size:11px;font-weight:700;color:#fff}
.combo-pct{font-size:11px;color:var(--text2);width:46px;text-align:right;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.combo-rank{font-size:10px;color:var(--text2);width:16px;flex-shrink:0}
.trend-wrap{padding:10px 14px;overflow-x:auto}
.trend-table{width:100%;border-collapse:collapse;min-width:280px}
.trend-table th{font-size:10px;color:var(--text2);padding:5px 4px;text-align:center;border-bottom:1px solid var(--border)}
.trend-table td{padding:5px 4px;text-align:center;font-size:11px}
.trend-cell{width:28px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin:0 auto}
.predict-box{padding:14px}
.predict-title{font-size:12px;color:var(--text2);margin-bottom:10px}
.predict-zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.suggest-nums{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;border:2px solid}
.sn.z1s{background:rgba(231,76,60,.15);border-color:var(--z1);color:var(--z1)}
.sn.z2s{background:rgba(46,204,113,.15);border-color:var(--z2);color:var(--z2)}
.sn.z3s{background:rgba(52,152,219,.15);border-color:var(--z3);color:var(--z3)}
.suggest-label{font-size:11px;color:var(--text2);margin-bottom:6px;margin-top:12px}
.note-box{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:rgba(124,92,252,.08);border:1px solid rgba(124,92,252,.2);font-size:11px;color:var(--text2);line-height:1.7}
.loading{text-align:center;padding:50px 20px;color:var(--text2)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{margin:20px;padding:16px;border-radius:12px;background:rgba(255,78,106,.1);border:1px solid rgba(255,78,106,.3);color:var(--red);text-align:center;font-size:13px;line-height:1.8}
.retry-btn{margin-top:12px;padding:8px 20px;border-radius:20px;border:1px solid var(--red);background:transparent;color:var(--red);font-family:'Noto Sans TC',sans-serif;font-size:13px;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <h1>🎱 台灣樂透大數據分析</h1>
  <div class="header-sub">
    <p>大樂透 (6/49) ｜ 今彩539 (5/39)</p>
    <span class="updated" id="updated-time">載入中...</span>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchGame('lotto649')">🔴 大樂透</button>
  <button class="tab-btn" onclick="switchGame('lottery539')">🟡 今彩539</button>
</div>

<div class="sec-tabs">
  <button class="sec-tab active" onclick="switchSection('freq')">🔥 熱冷分析</button>
  <button class="sec-tab" onclick="switchSection('zone')">📐 三區間</button>
  <button class="sec-tab" onclick="switchSection('predict')">🎯 組合推薦</button>
</div>

<div class="controls">
  <span class="control-label">分析期數：</span>
  <div class="period-btns">
    <button class="period-btn" onclick="setPeriod(30)">近30期</button>
    <button class="period-btn active" onclick="setPeriod(50)">近50期</button>
    <button class="period-btn" onclick="setPeriod(100)">近100期</button>
    <button class="period-btn" onclick="setPeriod(200)">近200期</button>
  </div>
</div>

<div id="app">
  <div class="loading"><div class="spinner"></div><p>載入開獎資料中...</p></div>
</div>

<div class="main active" id="sec-freq"></div>
<div class="main" id="sec-zone"></div>
<div class="main" id="sec-predict"></div>

<script>
let D = null;
let cg = 'lotto649', cp = 50, cs = 'freq';

const zoneConfig = {
  lotto649:   {z:[16,33], names:['低區','中區','高區'], ranges:['01–16','17–33','34–49'], colors:['#e74c3c','#2ecc71','#3498db']},
  lottery539: {z:[13,26], names:['低區','中區','高區'], ranges:['01–13','14–26','27–39'], colors:['#e74c3c','#2ecc71','#3498db']}
};

function pad(n){return String(n).padStart(2,'0')}

// ── 載入資料 ──
async function loadData(){
  try {
    const resp = await fetch('data/lottery.json?t=' + Date.now());
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    D = await resp.json();
    document.getElementById('app').style.display = 'none';
    document.getElementById('updated-time').textContent = '更新：' + (D.updatedAt || '');
    renderAll();
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="error-box">
        ⚠️ 無法載入開獎資料<br>
        <small>${e.message}</small><br><br>
        可能原因：<br>
        • GitHub Actions 尚未執行過<br>
        • 請先手動執行一次 workflow<br>
        • 或確認 data/lottery.json 已存在
        <br><button class="retry-btn" onclick="loadData()">重新載入</button>
      </div>`;
  }
}

function switchGame(g){
  cg=g;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&g==='lotto649')||(i===1&&g==='lottery539')));
  renderAll();
}
function setPeriod(n){
  cp=n;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.toggle('active',b.textContent===`近${n}期`));
  renderAll();
}
function switchSection(s){
  cs=s;
  document.querySelectorAll('.sec-tab').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes(`'${s}'`)));
  ['freq','zone','predict'].forEach(id=>{
    document.getElementById('sec-'+id).classList.toggle('active', id===s);
  });
}

function renderAll(){
  if(!D) return;
  renderFreq();
  renderZone();
  renderPredict();
}

// ── 熱冷分析 ──
function renderFreq(){
  const d=D[cg]?.[String(cp)];
  if(!d){document.getElementById('sec-freq').innerHTML='<div class="error-box">此期數資料不足</div>';return;}
  const freq=d.frequency, miss=d.missing;
  const allNums=Object.keys(freq).map(n=>({num:+n,count:freq[n],miss:miss[n]||0}));
  const sortedF=[...allNums].sort((a,b)=>b.count-a.count);
  const sortedM=[...allNums].sort((a,b)=>b.miss-a.miss);
  const maxC=sortedF[0].count, minC=sortedF[sortedF.length-1].count, maxM=sortedM[0].miss;
  const total=Object.values(freq).reduce((a,b)=>a+b,0);
  const maxNum=cg==='lotto649'?49:39;
  const avg=(total/maxNum).toFixed(1);
  const last=d.lastDraw;
  const zc=zoneConfig[cg];
  const byNum=[...allNums].sort((a,b)=>a.num-b.num);
  const hcol=['#c0392b','#e74c3c','#e67e22','#e67e22','#f39c12','#f39c12','#f1c40f','#f1c40f','#f1c40f','#f1c40f'];
  const ccol=['#1a4b8c','#1a4b8c','#2471a3','#2471a3','#2980b9','#2980b9','#5dade2','#5dade2','#85c1e9','#85c1e9'];
  const ctxt=['#fff','#fff','#fff','#fff','#fff','#fff','#fff','#fff','#333','#333'];

  function hl(c){return Math.round((c-minC)/(maxC-minC||1)*5)}
  function cl(m){return Math.round(m/(maxM||1)*5)}
  function zc_class(n){if(n<=zc.z[0])return 'z1-num';if(n<=zc.z[1])return 'z2-num';return 'z3-num';}

  let h='';

  // ── 最近10期開獎紀錄 ──
  const recent10 = d.recentDraws || [];
  h+=`<div class="sc">
    ${collapseHeader('recent-draws-body','📋 最近10期開獎紀錄','📋','rgba(245,200,66,.2)',`最新：${last.period}`,'true')}
      ${recent10.slice(0,10).map((draw,i)=>{
        const isLatest = i===0;
        const period = draw.period || (isLatest ? last.period : '');
        const date   = draw.date   || (isLatest ? last.date   : '');
        return `<div style="padding:10px 14px;border-top:${i===0?'none':'1px solid var(--border)'};background:${isLatest?'rgba(245,200,66,.04)':'transparent'}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:10px;color:${isLatest?'var(--gold)':'var(--text2)'};font-weight:${isLatest?'700':'400'}">
              ${isLatest?'🔴 ':''}${period}${date?' ｜ '+date:''}
            </span>
            <div style="display:flex;gap:4px">
              ${(draw.zones||[]).map((v,zi)=>`<span style="font-size:9px;background:${zc.colors[zi]}22;color:${zc.colors[zi]};border:1px solid ${zc.colors[zi]}33;border-radius:8px;padding:1px 5px">${v}</span>`).join('')}
            </div>
          </div>
          <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
            ${(draw.numbers||[]).map(n=>`<div style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;background:var(--card2);border:2px solid ${isLatest?'var(--gold)':'var(--border)'};color:${isLatest?'var(--gold)':'var(--text)'}">${pad(n)}</div>`).join('')}
            ${draw.special?`<span style="color:var(--text2);font-size:12px">＋</span><div style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;background:rgba(245,200,66,.15);border:2px solid var(--gold);color:var(--gold)">${pad(draw.special)}</div>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  h+=`<div class="sc">
    <div class="stats-row">
      <div class="stat-cell"><div class="stat-val" style="color:var(--gold)">${cp}</div><div class="stat-lbl">分析期數</div></div>
      <div class="stat-cell"><div class="stat-val" style="color:var(--green)">${avg}</div><div class="stat-lbl">平均出現</div></div>
      <div class="stat-cell"><div class="stat-val" style="color:var(--red)">${maxC}</div><div class="stat-lbl">最高次數</div></div>
    </div>
  </div>`;

  h+=`<div class="sc">
    <div class="sh"><span class="si" style="background:rgba(255,78,106,.2)">🔥</span><span class="st">熱門號碼分布</span><span class="ss">框色=所屬區間</span></div>
    <div class="num-grid">${byNum.map(it=>`<div class="nb h${hl(it.count)} ${zc_class(it.num)}">${pad(it.num)}<span class="cnt">${it.count}次</span></div>`).join('')}</div>
    <div class="legend">
      <span class="li"><span class="ld" style="background:#c0392b"></span>極熱</span>
      <span class="li"><span class="ld" style="background:#e67e22"></span>熱</span>
      <span class="li"><span class="ld" style="background:#f1c40f"></span>暖</span>
      <span class="li"><span class="ld" style="background:#2a2a45;border:1px solid #444"></span>冷</span>
      ${zc.colors.map((c,i)=>`<span class="li"><span class="ld" style="background:transparent;border:2px solid ${c}"></span>${zc.names[i]}</span>`).join('')}
    </div>
  </div>`;

  h+=`<div class="sc">
    <div class="sh"><span class="si" style="background:rgba(255,78,106,.2)">📈</span><span class="st">出現最多 TOP 10</span></div>
    <div class="bar-list">${sortedF.slice(0,10).map((it,i)=>{
      const pct=(it.count/maxC*100).toFixed(0);
      const tc=i<6?'#fff':'#333';
      return `<div class="bar-row">
        <div class="bar-num" style="background:${hcol[i]};color:${tc}">${pad(it.num)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${hcol[i]};color:${tc}">${it.count}次</div></div>
        <div class="bar-value">${pct}%</div>
      </div>`;
    }).join('')}</div></div>`;

  h+=`<div class="sc">
    <div class="sh"><span class="si" style="background:rgba(78,155,255,.2)">🧊</span><span class="st">遺漏號碼分布</span><span class="ss">數字=未出現期數</span></div>
    <div class="num-grid">${byNum.map(it=>{
      const lv=cl(it.miss);
      const cls=it.miss>maxM*0.55?`c${lv}`:'h0';
      return `<div class="nb ${cls} ${zc_class(it.num)}">${pad(it.num)}<span class="cnt">${it.miss}期</span></div>`;
    }).join('')}</div>
    <div class="legend">
      <span class="li"><span class="ld" style="background:#1a4b8c"></span>極冷</span>
      <span class="li"><span class="ld" style="background:#2980b9"></span>冷</span>

// 收合狀態
const collapseState = {};
function toggleCollapse(id){
  const body = document.getElementById(id);

  if(!body) return;
  const hidden = body.style.display==='none';
  body.style.display = hidden ? '' : 'none';

function collapseHeader(id, title, icon, iconBg, count, defaultOpen=true){

function renderPredict(){
  const d=D[cg]?.[String(cp)];
  if(!d){document.getElementById('sec-predict').innerHTML='<div class="error-box">資料不足</div>';return;}
  const zc=zoneConfig[cg];
  const combos=Object.entries(d.zoneCombos||{}).sort((a,b)=>b[1]-a[1]);
  const freq=d.frequency, miss=d.missing;
  const numDraw=cg==='lotto649'?6:5;
  const maxNum=cg==='lotto649'?49:39;

  const allNumsArr=Object.keys(freq).map(n=>({num:+n,count:+freq[n],miss:+(miss[n]||0)}));
  const lastNums=(d.recentDraws?.[0]?.numbers)||(d.lastDraw?.numbers)||[];

  // ── 近期趨勢計算 ──
  const recent5draws=(d.recentDraws||[]).slice(0,5);
  const recent10draws=(d.recentDraws||[]).slice(0,10);

  // 近5期出現的號碼集合（短期熱號）
  const recent5set=new Set(recent5draws.flatMap(dr=>dr.numbers||[]));

  // 連續2期以上出現的號碼（加權）
  const consecSet=new Set();
  if(recent5draws.length>=2){
    const s0=new Set(recent5draws[0]?.numbers||[]);
    const s1=new Set(recent5draws[1]?.numbers||[]);
    s0.forEach(n=>{ if(s1.has(n)) consecSet.add(n); });
    // 也看第2~3期
    if(recent5draws.length>=3){
      const s2=new Set(recent5draws[2]?.numbers||[]);
      s1.forEach(n=>{ if(s2.has(n)) consecSet.add(n); });
    }
  }

  // 近5期各區間出現總數（最近開最多的區）
  const recentZoneCount=[0,0,0];
  recent5draws.forEach(dr=>{
    (dr.zones||[]).forEach((v,zi)=>{ recentZoneCount[zi]+=v; });
  });
  const recentHotZone=recentZoneCount.indexOf(Math.max(...recentZoneCount)); // 0=低 1=中 2=高

  // 趨勢加權排分函式：近5期出現+3，連續出現+5，其餘用原始熱度
  function trendScore(num){
    let score = (freq[num]||0)*2 + (miss[num]||0)*0.5;
    if(recent5set.has(num)) score += 3;
    if(consecSet.has(num))  score += 5;
    return score;
  }

  // 趨勢排行（全號碼）
  const trendRank=[...allNumsArr].sort((a,b)=>trendScore(b.num)-trendScore(a.num));
  const hotRank=trendRank; // 混合策略熱號改用趨勢排行
  const coldRank=[...allNumsArr].sort((a,b)=>b.miss-a.miss);

  // 三區間 pool 也改為趨勢加權排序
  function zoneNumsTrend(lo,hi){
    return Object.keys(freq)
      .map(n=>({num:+n,count:+freq[n],miss:+(miss[n]||0)}))
      .filter(x=>x.num>=lo&&x.num<=hi)
      .sort((a,b)=>trendScore(b.num)-trendScore(a.num));
  }
  const pool1=zoneNumsTrend(1,zc.z[0]);
  const pool2=zoneNumsTrend(zc.z[0]+1,zc.z[1]);
  const pool3=zoneNumsTrend(zc.z[1]+1,maxNum);

  function seededRand(seed,min,max){return min+Math.abs(Math.sin(seed*1.618+1)*99991|0)%(max-min+1);}

  // 產生一組混合策略，每組用不同 seed 變化隨機號
  function buildMixed(seed){
    const used=new Set();
    // 保留上期：每組輪流取上期不同的號碼位置
    const keepIdx=seededRand(seed,0,lastNums.length-1);
    const keepNum=lastNums[keepIdx]||lastNums[0];
    if(keepNum) used.add(keepNum);
    // 熱號 2
    const hotPicked=[];
    // 每組熱號從不同起始點取，讓10組有差異
    const hotOffset=seededRand(seed+3,0,4);
    let hi=0;
    for(const x of hotRank){
      if(!used.has(x.num)){
        if(hi>=hotOffset && hotPicked.length<2){hotPicked.push(x.num);used.add(x.num);}
        else if(hi<hotOffset){}
        hi++;
        if(hotPicked.length>=2) break;
      }
    }
    // 補滿熱號
    for(const x of hotRank){if(hotPicked.length>=2)break;if(!used.has(x.num)){hotPicked.push(x.num);used.add(x.num);}}
    // 冷號 2
    const coldPicked=[];
    const coldOffset=seededRand(seed+5,0,4);
    let ci=0;
    for(const x of coldRank){
      if(!used.has(x.num)){
        if(ci>=coldOffset && coldPicked.length<2){coldPicked.push(x.num);used.add(x.num);}
        else if(ci<coldOffset){}
        ci++;
        if(coldPicked.length>=2) break;
      }
    }
    for(const x of coldRank){if(coldPicked.length>=2)break;if(!used.has(x.num)){coldPicked.push(x.num);used.add(x.num);}}
    // 隨機 1（只有大樂透6個才加，今彩539上期1+熱2+冷2已滿5個）
    let randNum=null;
    if(numDraw >= 6){
      const remaining=Array.from({length:maxNum},(_,i)=>i+1).filter(n=>!used.has(n));
      const randIdx=seededRand(seed+7,0,remaining.length-1);
      randNum=remaining[randIdx];
      if(randNum) used.add(randNum);
    }
    return {keepNum,hotPicked,coldPicked,randNum};
  }

  // 特別號
  let spRecommend=null;
  let spPool=[];
  if(cg==='lotto649'&&d.specialFrequency){
    const spFreq=d.specialFrequency,spMiss=d.specialMissing||{};
    const spNums=Object.keys(spFreq).map(n=>({num:+n,count:+spFreq[n],miss:+(spMiss[n]||0)}));
    const spScored=[...spNums].sort((a,b)=>(b.count*2+b.miss)-(a.count*2+a.miss));
    spPool=spScored.map(x=>x.num);
    spRecommend={
      hot:spScored[0],
      miss:[...spNums].sort((a,b)=>b.miss-a.miss)[0],
      top5hot:spScored.slice(0,5).map(x=>x.num),
      top5miss:[...spNums].sort((a,b)=>b.miss-a.miss).slice(0,5).map(x=>x.num),
    };
  }

  const roleStyle={
    keep:{bg:'rgba(245,200,66,.15)',border:'#f5c842',color:'#f5c842',label:'🔁上期'},
    hot: {bg:'rgba(231,76,60,.15)', border:'#e74c3c',color:'#e74c3c',label:'🔥熱'},
    cold:{bg:'rgba(52,152,219,.15)',border:'#3498db',color:'#3498db',label:'🧊冷'},
    rand:{bg:'rgba(155,89,182,.15)',border:'#9b59b6',color:'#9b59b6',label:'🎲隨機'},
  };

  // 號碼球（緊湊版，帶標籤）
  function ballRow(items, spNum){
    const sorted=[...items].sort((a,b)=>a.n-b.n);
    return `<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
      ${sorted.map(({n,role})=>{
        const s=roleStyle[role];
        return `<div style="text-align:center">
          <div style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;background:${s.bg};border:2px solid ${s.border};color:${s.color}">${pad(n)}</div>
          <div style="font-size:7px;color:${s.color};margin-top:2px">${s.label}</div>
        </div>`;
      }).join('')}
      ${spNum!=null?`<span style="color:var(--text2);font-size:13px;margin:0 2px">＋</span>
      <div style="text-align:center">
        <div style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;background:rgba(245,200,66,.2);border:2px solid var(--gold);color:var(--gold)">${pad(spNum)}</div>
        <div style="font-size:7px;color:var(--gold);margin-top:2px">⭐特別</div>
      </div>`:''}
    </div>`;
  }

  let h='';

  // 趨勢指標文字
  const zoneNames=['低區','中區','高區'];
  const recentHotZoneName=zoneNames[recentHotZone];
  const consecArr=[...consecSet].map(n=>pad(n)).join(' ');
  const recent5arr=[...recent5set].map(n=>pad(n)).sort().join(' ');
  const trendInfo=`
    <div style="padding:6px 14px 8px;display:flex;gap:6px;flex-wrap:wrap">
      <span style="font-size:10px;background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);border-radius:8px;padding:2px 8px;color:#e74c3c">🔥近5期熱：${recent5arr||'—'}</span>
      ${consecArr?`<span style="font-size:10px;background:rgba(245,200,66,.1);border:1px solid rgba(245,200,66,.3);border-radius:8px;padding:2px 8px;color:var(--gold)">🔄連續出現：${consecArr}</span>`:''}
      <span style="font-size:10px;background:${zc.colors[recentHotZone]}22;border:1px solid ${zc.colors[recentHotZone]}44;border-radius:8px;padding:2px 8px;color:${zc.colors[recentHotZone]}">📈近期最熱：${recentHotZoneName}</span>
    </div>`;

  // ══ 三區間 10 組（上方）══
  // 取得上一期的區間組合 key，排除相同組合
  const lastDrawZones=(d.recentDraws?.[0]?.zones)||[];
  const lastZoneKey=lastDrawZones.length===3?lastDrawZones.join('-'):null;
  const lastSet=new Set(lastNums);

  // 從最熱組合中排除與上期相同的區間組合，再取前10
  const filteredCombos=combos.filter(([key])=>key!==lastZoneKey);
  const top10combos=filteredCombos.slice(0,Math.min(10,filteredCombos.length));
  const rankEmoji=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];

  function buildZoneSet(key, gi){
    const parts=key.split('-').map(Number);
    function pickFromPool(pool, need, offset){
      const res=[];
      for(let i=0;i<pool.length&&res.length<need;i++){
        const idx=(i+offset)%pool.length;
        res.push(pool[idx].num);
      }
      return res.slice(0,need);
    }
    const off=gi%5;
    const nums1=parts[0]>0?pickFromPool(pool1,parts[0],off):[];
    const nums2=parts[1]>0?pickFromPool(pool2,parts[1],off):[];
    const nums3=parts[2]>0?pickFromPool(pool3,parts[2],off):[];
    return {parts, nums1, nums2, nums3};
  }

  h+=`<div class="sc">
    ${collapseHeader('zone-body','🎯 三區間 10 組','🎯','rgba(66,230,149,.2)','','true')}
      <div style="padding:8px 14px 4px;font-size:11px;color:var(--text2)">
        依最常出現的區間比例推薦，號碼以近期趨勢加權排序${cg==='lotto649'?'，含特別號':''}
      </div>
      <div style="padding:0 14px 8px;display:flex;gap:6px;flex-wrap:wrap">
        <span style="font-size:10px;background:${zc.colors[recentHotZone]}22;border:1px solid ${zc.colors[recentHotZone]}44;border-radius:8px;padding:2px 8px;color:${zc.colors[recentHotZone]}">📈近5期最熱：${recentHotZoneName}（${recentZoneCount[recentHotZone]}個）</span>
        ${consecArr?`<span style="font-size:10px;background:rgba(245,200,66,.1);border:1px solid rgba(245,200,66,.3);border-radius:8px;padding:2px 8px;color:var(--gold)">🔄連續號：${consecArr}</span>`:''}
        ${lastZoneKey?`<span style="font-size:10px;background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);border-radius:8px;padding:2px 8px;color:#e74c3c">🚫已排除上期：${lastZoneKey.split('-').map((v,i)=>`${zc.names[i]}${v}`).join(' ')}</span>`:''}
      </div>
      ${top10combos.map(([key,cnt],gi)=>{
        const {parts,nums1,nums2,nums3}=buildZoneSet(key,gi);
        const allNs=[...nums1.map(n=>({n,z:0})),...nums2.map(n=>({n,z:1})),...nums3.map(n=>({n,z:2}))].sort((a,b)=>a.n-b.n);
        const spNum=spPool.length>0?spPool[(gi+2)%spPool.length]:null;
        return `<div style="padding:10px 14px;border-top:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap">
            <span style="font-size:12px">${rankEmoji[gi]}</span>
            ${parts.map((p,pi)=>`<span style="background:${zc.colors[pi]};color:#fff;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700">${zc.names[pi]}${p}</span>`).join('')}
            <span style="font-size:10px;color:var(--text2);margin-left:auto">出現${cnt}次</span>
          </div>
          <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
            ${allNs.map(({n,z})=>{
              const isRepeat=lastSet.has(n);
              return `<div style="text-align:center">
                <div style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;
                  background:${isRepeat?'rgba(245,200,66,.2)':zc.colors[z]+'22'};
                  border:2px solid ${isRepeat?'var(--gold)':zc.colors[z]};
                  color:${isRepeat?'var(--gold)':zc.colors[z]}">${pad(n)}</div>
                ${isRepeat?`<div style="font-size:7px;color:var(--gold);margin-top:2px">🔁上期</div>`:`<div style="font-size:7px;margin-top:2px">&nbsp;</div>`}
              </div>`;
            }).join('')}
            ${spNum!=null?`<span style="color:var(--text2);font-size:13px;margin:0 2px">＋</span><div style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;background:rgba(245,200,66,.2);border:2px solid var(--gold);color:var(--gold)">${pad(spNum)}</div>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  // ══ 混合策略 10 組（下方）══
  const mixed10=Array.from({length:10},(_,i)=>buildMixed(mixedSeed+i*97));

  h+=`<div class="sc">
    ${collapseHeader('mixed-body','🃏 混合策略 10 組','🃏','rgba(155,89,182,.2)','','true')}
      <div style="padding:10px 14px 4px;display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:11px;color:var(--text2)">上期：${lastNums.map(n=>`<span style="font-family:'JetBrains Mono',monospace;color:${recent5set.has(n)?'#e74c3c':consecSet.has(n)?'var(--gold)':'var(--text)'}">${pad(n)}</span>`).join(' ')}</div>
        <button onclick="mixedSeed=Date.now();renderPredict()" style="padding:4px 10px;border-radius:14px;border:1px solid #9b59b6;background:rgba(155,89,182,.15);color:#9b59b6;font-size:11px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;font-weight:700">🔄 換一批</button>
      </div>
      ${trendInfo}
      <div style="padding:0 14px 4px;display:flex;gap:10px;flex-wrap:wrap">
        ${Object.values(roleStyle).map(s=>`<span style="font-size:10px;color:${s.color}">${s.label}</span>`).join('')}
        ${spRecommend?`<span style="font-size:10px;color:var(--gold)">⭐特別號</span>`:''}
      </div>
      ${mixed10.map((m,i)=>{
        const items=[
          ...(m.keepNum?[{n:m.keepNum,role:'keep'}]:[]),
          ...m.hotPicked.map(n=>({n,role:'hot'})),
          ...m.coldPicked.map(n=>({n,role:'cold'})),
          ...(m.randNum?[{n:m.randNum,role:'rand'}]:[]),
        ];
        const spNum=spPool.length>0?spPool[i%spPool.length]:null;
        return `<div style="padding:10px 14px;border-top:1px solid var(--border)">
          <div style="font-size:10px;color:var(--text2);margin-bottom:6px;font-weight:700">第 ${i+1} 組</div>
          ${ballRow(items, spNum)}
        </div>`;
      }).join('')}
    </div>
  </div>`;

  // ══ 近10期未出現號碼池 ══
  const recent10set=new Set(recent10draws.flatMap(dr=>dr.numbers||[]));
  const coldPool=Array.from({length:maxNum},(_,i)=>i+1).filter(n=>!recent10set.has(n));
  // 依遺漏期數排序
  coldPool.sort((a,b)=>(miss[b]||0)-(miss[a]||0));
  // 區分三個區間
  function getZone(n){ if(n<=zc.z[0])return 0; if(n<=zc.z[1])return 1; return 2; }

  h+=`<div class="sc">
    ${collapseHeader('cold-pool-body','❄️ 近10期未出現號碼','❄️','rgba(52,152,219,.2)','','true')}
      <div style="padding:8px 14px 4px;font-size:11px;color:var(--text2)">
        以下 <strong style="color:var(--blue)">${coldPool.length}</strong> 個號碼近10期都沒開過，數字越深藍代表遺漏越久
      </div>
      <div style="padding:8px 14px 14px;display:flex;gap:7px;flex-wrap:wrap">
        ${coldPool.map(n=>{
          const missCnt=miss[n]||0;
          const maxMiss=Math.max(...coldPool.map(x=>miss[x]||0),1);
          const intensity=0.3+0.7*(missCnt/maxMiss);
          const z=getZone(n);
          return `<div style="text-align:center">
            <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;background:${zc.colors[z]}${Math.round(intensity*40).toString(16).padStart(2,'0')};border:2px solid ${zc.colors[z]};color:${zc.colors[z]}">${pad(n)}</div>
            <div style="font-size:8px;color:var(--text2);margin-top:2px">${missCnt}期</div>
          </div>`;
        }).join('')}
      </div>
      <div style="padding:0 14px 10px;display:flex;gap:6px;flex-wrap:wrap">
        ${[0,1,2].map(zi=>{
          const zNums=coldPool.filter(n=>getZone(n)===zi);
          return `<span style="font-size:10px;background:${zc.colors[zi]}22;border:1px solid ${zc.colors[zi]}44;border-radius:8px;padding:2px 8px;color:${zc.colors[zi]}">${zc.names[zi]}：${zNums.length}個</span>`;
        }).join('')}
      </div>
    </div>
  </div>`;
  h+=`<div class="sc">
    ${collapseHeader('info-body','💡 選號邏輯說明','💡','rgba(245,200,66,.2)','','false')}
      <div style="padding:14px;font-size:12px;line-height:1.9;color:var(--text)">
        <p style="margin-bottom:6px"><strong style="color:#9b59b6">🃏 混合策略</strong></p>
        <p>🔁 上期保留×1 — 歷史約25–30%有號碼跨期重複</p>
        <p>🔥 熱號×2 — 每組從熱號不同起點取，10組各異</p>
        <p>🧊 冷號×2 — 遺漏最久，「欠出」概念</p>
        <p>🎲 隨機×1 — 增加不確定性，按「換一批」全部重換</p>
        <p style="margin-top:10px;margin-bottom:6px"><strong style="color:var(--green)">🎯 三區間策略</strong></p>
        <p style="color:var(--text2);font-family:'JetBrains Mono',monospace;background:var(--bg2);padding:8px;border-radius:8px;font-size:11px">趨勢分數 = 長期頻率×2 + 遺漏×0.5 + 近5期出現+3 + 連續出現+5</p>
        <p style="margin-top:6px">10組各對應歷史最常出現的10種比例，號碼從趨勢分數最高者取</p>
        ${spRecommend?`<p style="margin-top:10px"><strong style="color:var(--gold)">⭐ 特別號</strong>：從49顆球扣掉正號後獨立抽出，10組輪流取特別號熱門池前10名</p>`:''}
      </div>
    </div>
  </div>`;

  h+=`<div class="note-box">🎯 推薦號碼由真實開獎統計自動計算，每日更新。<br>⚠️ 樂透為完全隨機，本工具無法預測結果，請量力購彩，切勿沉迷。</div>`;
  document.getElementById('sec-predict').innerHTML=h;
}

// ── 啟動 ──
loadData();
</script>
